server {
    listen 80;
    listen [::]:80;
    server_name vvuzz.intdata.pro;

    access_log /var/log/nginx/vvuzz.intdata.pro.access.log main;
    error_log  /var/log/nginx/vvuzz.intdata.pro.error.log warn;

    location /.well-known/acme-challenge/ {
        alias /var/www/letsencrypt/.well-known/acme-challenge/;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vvuzz.intdata.pro;

    access_log /var/log/nginx/vvuzz.intdata.pro.access.log main;
    error_log  /var/log/nginx/vvuzz.intdata.pro.error.log warn;

    ssl_certificate     /etc/letsencrypt/live/intdata.pro-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intdata.pro-wildcard/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_pass http://127.0.0.1:9176;
    }
}
